[project]
authors = [{name = "Colby Wilkinson", email = "wilkinson.colby@gmail.com"}]
dependencies = ["langgraph>=1.2.10,<2", "langchain>=1.3.14,<2", "langchain-anthropic>=1,<2", "langchain-voyageai>=0.4,<1","langchain-chroma>=1.1.0,<2", "chromadb>=1.5.9,<2", "pymupdf>=1.28.2,<2", "trustcall>=0.0.39,<0.0.40", "pydantic>=2.13.4,<3", "python-dotenv>=1.2.2,<2", "langgraph-cli[inmem]>=0.4.31,<0.5", "docling>=2,<3", "wordsegment>=1.3,<2"]
name = "kdigo-guideline-rag"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
extend-exclude = [".pixi", "notebooks"]
line-length = 110

[tool.pytest.ini_options]
markers = ["integration: requires live API keys and network access (Voyage/Anthropic); excluded by default"]
addopts = "-m 'not integration'"
pythonpath = ["."]  # lets tests import app/ui_helpers.py (the UI env doesn't install the package)

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
kdigo_guideline_rag = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"
test-integration = "pytest -m integration"
lint = "ruff check ."
fmt = "ruff format ."
ingest = { cmd = "python -m kdigo_guideline_rag.ingest", env = { TORCH_COMPILE_DISABLE = "1", PYTORCH_JIT = "0" } }
explore = "marimo edit notebooks/exploration.py"
dev = "langgraph dev"
eval = "python -m kdigo_guideline_rag.eval pipeline"
eval-retrieval = "python -m kdigo_guideline_rag.eval retrieval"
eval-verify = "python -m kdigo_guideline_rag.eval verify"
eval-judge = "python -m kdigo_guideline_rag.eval judge"
eval-conversations = "python -m kdigo_guideline_rag.eval conversations"

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"

[tool.pixi.feature.docparse.dependencies]
qpdf = "*"
pikepdf = "*"
tesseract = "*"

[tool.pixi.feature.docparse.pypi-dependencies]
unstructured = { version = "*", extras = ["pdf"] }

# Streamlit client: talks to the LangGraph API server over HTTP only, so it
# deliberately excludes the RAG package and its PDF/ML stack (Docling, torch).
[tool.pixi.feature.ui.dependencies]
python = "3.11.*"

# Both from PyPI: conda's streamlit pins websockets 17, which langgraph-sdk
# (websockets<17) can't use -- one resolver picks compatible versions.
[tool.pixi.feature.ui.pypi-dependencies]
streamlit = ">=1.50,<2"
langgraph-sdk = ">=0.4,<0.5"

[tool.pixi.feature.ui.tasks]
ui = "streamlit run app/streamlit_app.py"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ui = { features = ["ui"], no-default-feature = true }
docparse = { features = ["docparse"], solve-group = "docparse" }

[dependency-groups]
dev = ["marimo>=0.23.16,<0.24"]
